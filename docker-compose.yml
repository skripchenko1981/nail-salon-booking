version: '3.8'

services:
  mongo:
    image: mongo:6
    container_name: beauty-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password123}
    volumes:
      - beauty_mongo_data:/data/db
    networks:
      - nextcloud_app-network

  beauty-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: beauty-backend
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-password123}@mongo:27017/
      DB_NAME: ${DB_NAME:-beauty_salon}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://beauty-alena.pp.ua}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
    expose:
      - "8000"
    depends_on:
      - mongo
    networks:
      - nextcloud_app-network
    command: uvicorn server:app --host 0.0.0.0 --port 8000

  beauty-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-https://beauty-alena.pp.ua}
    container_name: beauty-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - beauty-backend
    networks:
      - nextcloud_app-network

volumes:
  beauty_mongo_data:

networks:
  nextcloud_app-network:
    external: true